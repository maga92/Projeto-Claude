<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Major League Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app">
    <!-- TOP BAR -->
    <header id="top-bar">
      <span class="top-bar__brand">MLL</span>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Buscar campeonatos, times, partidas..."
          autocomplete="off"
        >
        <div id="search-results" class="search-results hidden"></div>
      </div>

      <div class="top-bar__actions">
        <span id="save-indicator">✓ Salvo</span>

        <div class="data-menu" id="data-menu">
          <button class="btn btn--ghost btn--sm" id="btn-data-menu" title="Exportar / Importar dados">
            ⚙️
          </button>
          <div class="data-menu__dropdown hidden" id="data-dropdown">
            <button class="data-menu-item" id="btn-export">
              <span class="data-menu-item__icon">📤</span>
              Exportar dados
            </button>
            <button class="data-menu-item" id="btn-import">
              <span class="data-menu-item__icon">📥</span>
              Importar dados
            </button>
          </div>
          <input type="file" id="import-file-input" accept=".json" hidden>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="content"></main>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav">
      <button class="nav-item" data-route="home">
        <span class="nav-item__icon">🏠</span>
        <span>Início</span>
      </button>
      <button class="nav-item" data-route="championships">
        <span class="nav-item__icon">🏆</span>
        <span>Campeonatos</span>
      </button>
      <button class="nav-item" data-route="rankings">
        <span class="nav-item__icon">📊</span>
        <span>Rankings</span>
      </button>
      <button class="nav-item" data-route="profile">
        <span class="nav-item__icon">👤</span>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- App entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
